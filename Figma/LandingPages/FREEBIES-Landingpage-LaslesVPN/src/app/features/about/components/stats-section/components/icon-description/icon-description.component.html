<div class="container-icon-description">
    <figure class="container-icon m-0 mr-4">
        <img [src]="iconSrc" [alt]="iconAlt">
    </figure>
    <div class="container-description">
        <h3 class="m-0">{{value}}</h3>
        <p class="m-0">{{description}}</p>
    </div>
</div>
<hr *ngIf="showDivider" class="w-0 h-16 border border-solid border-[#EEEFF2]">
